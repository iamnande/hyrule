suite: app-platform real service values
templates:
  - charts/app/templates/deployment.yaml
  - charts/app/templates/service.yaml

tests:
  - it: renders pings end to end through the wrapper
    values:
      - ../../../values/pings/values.yaml
    asserts:
      - template: charts/app/templates/deployment.yaml
        isKind:
          of: Deployment
      - template: charts/app/templates/deployment.yaml
        equal:
          path: metadata.name
          value: pings
      - template: charts/app/templates/deployment.yaml
        equal:
          path: metadata.labels
          value:
            helm.sh/chart: app-0.1.0
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
      - template: charts/app/templates/service.yaml
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME
      - template: charts/app/templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /startupz
      - template: charts/app/templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - template: charts/app/templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: renders iam-jwks end to end through the wrapper
    values:
      - ../../../values/iam-jwks/values.yaml
    asserts:
      - template: charts/app/templates/deployment.yaml
        isKind:
          of: Deployment
      - template: charts/app/templates/deployment.yaml
        equal:
          path: metadata.name
          value: iam-jwks
      - template: charts/app/templates/deployment.yaml
        equal:
          path: metadata.labels
          value:
            helm.sh/chart: app-0.1.0
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
      - template: charts/app/templates/service.yaml
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME
