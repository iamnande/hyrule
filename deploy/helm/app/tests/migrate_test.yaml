suite: app migrate
templates:
  - migrate.yaml

tests:
  - it: renders nothing with no datastores
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when schema_management is disabled
    set:
      datastores:
        - slug: pings
          flavor: postgres
          schema_management: disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PreSync Job for a postgres datastore
    set:
      fullnameOverride: pings
      datastores:
        - slug: pings
          flavor: postgres
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: pings-migrate
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      - matchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: /pings\?sslmode=
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: pings-migrations
