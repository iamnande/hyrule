global:
  image:
    registry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# deployment | statefulset | daemonset | job | cronjob
mode: deployment

image:
  registry: ""
  repository: docker/whalesay
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  enabled: true
  type: ClusterIP
  port: 8000

probes:
  startup:
    enabled: true
    path: /startupz
  liveness:
    enabled: true
    path: /livez
  readiness:
    enabled: true
    path: /readyz

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

env:
  HYRULE_ENVIRONMENT: local
extraEnv: []
extraEnvFrom: []

datastores: []

postgres:
  host: postgres-rw.databases.svc.cluster.local
  port: 5432
  ownerUser: hyrule_owner
  ownerPassword: hyrule_owner
  sslMode: disable

migrate:
  image:
    repository: docker.io/migrate/migrate
    tag: v4.19.1
  backoffLimit: 0

extraVolumes: []
extraVolumeMounts: []
additionalContainers: []
initContainers: []
additionalServices: []

rbac:
  role:
    extraRules: []
