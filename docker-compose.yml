services:
  hyrule-database:
    image: docker.io/postgres:17.2-alpine
    container_name: hyrule-database
    environment:
      - POSTGRES_USER=hyrule_owner
      - POSTGRES_PASSWORD=hyrule_owner
      - POSTGRES_DB=hyrule
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hyrule_owner -d hyrule']
      interval: 2s
      timeout: 2s
      retries: 15

  hyrule-mail-server:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: hyrule-mail-server
    ports:
      - '1025:1025'
      - '8025:8025'
