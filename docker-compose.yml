services:
  hyrule-database:
    image: amazon/dynamodb-local:1.25.1
    container_name: hyrule-database
    command: '-jar DynamoDBLocal.jar -sharedDb -inMemory -port 5432'
    ports:
      - '5432:5432'

  hyrule-database-schema-migration:
    image: amazon/aws-cli:2.23.2
    container_name: hyrule-database-schema-migration
    restart: on-failure
    depends_on:
      - hyrule-database
    environment:
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    command:
      [
        '--endpoint-url', 'http://hyrule-database:5432',
        'dynamodb', 'create-table',
        '--table-name', 'hyrule',
        '--attribute-definitions', 'AttributeName=PK,AttributeType=S', 'AttributeName=SK,AttributeType=S',
        '--key-schema', 'AttributeName=PK,KeyType=HASH', 'AttributeName=SK,KeyType=RANGE',
        '--billing-mode', 'PAY_PER_REQUEST',
      ]
