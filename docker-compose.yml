services:
  hyrule-database:
    image: docker.io/amazon/dynamodb-local:1.25.1
    container_name: hyrule-database
    command: '-jar DynamoDBLocal.jar -sharedDb -inMemory -port 5432'
    ports:
      - '5432:5432'

  hyrule-database-schema-migration:
    image: docker.io/amazon/aws-cli:2.23.2
    container_name: hyrule-database-schema-migration
    restart: on-failure
    depends_on:
      - hyrule-database
    environment:
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    command:
      [
        '--endpoint-url', 'http://hyrule-database:5432',
            'dynamodb', 'create-table',
        '--table-name', 'platform-hyrule',
        '--attribute-definitions',
            'AttributeName=PK,AttributeType=S',
            'AttributeName=SK,AttributeType=S',
            'AttributeName=UserEmail,AttributeType=S',
            'AttributeName=InviteToken,AttributeType=S',
            'AttributeName=InviteStatus,AttributeType=S',
        '--key-schema',
            'AttributeName=PK,KeyType=HASH',
            'AttributeName=SK,KeyType=RANGE',
        '--global-secondary-indexes',
        '[{
            "IndexName": "EmailIndex",
            "KeySchema": [
                {"AttributeName": "UserEmail", "KeyType": "HASH"},
                {"AttributeName": "SK", "KeyType": "RANGE"}
            ],
            "Projection": {"ProjectionType": "KEYS_ONLY"}
        },
        {
            "IndexName": "InviteIndex",
            "KeySchema": [
                {"AttributeName": "InviteToken", "KeyType": "HASH"},
                {"AttributeName": "InviteStatus", "KeyType": "RANGE"}
            ],
            "Projection": {"ProjectionType": "KEYS_ONLY"}
        }]',
        '--billing-mode', 'PAY_PER_REQUEST'
      ]

  hyrule-mail-server:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: hyrule-mail-server
    ports:
      - '1025:1025'
      - '8025:8025'
