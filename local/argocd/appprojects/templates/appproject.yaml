{{- $services := .Files.Get "services.yaml" | fromYamlArray }}
{{- range $services }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .service }}
  namespace: argocd
  labels:
    team: {{ .team }}
    domain: {{ .domain }}
spec:
  sourceRepos:
    - https://github.com/iamnande/hyrule
  destinations:
    - namespace: {{ .service }}
      server: '*'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
{{- end }}
